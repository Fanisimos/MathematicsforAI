<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive, game-based companion for first-year Mathematics for AI: derivatives, optimisation, partial derivatives and integration." />
    <meta name="theme-color" content="#0b0d17" />
    <title>Descent · Maths for AI, played</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Static copy of the feedback form so Netlify Forms detects it at deploy time. The real form is rendered by React.
         Netlify only stores the fields listed here, so this is also the complete list of what a review records.
         Anonymous by design: no name, no student number, no usage history. -->
    <form name="feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="feedback" />
      <input name="rating" /><input name="helped" /><input name="topic" />
      <textarea name="comments"></textarea><textarea name="mistakes"></textarea>
      <input name="trigger" /><input name="app_version" /><input name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
